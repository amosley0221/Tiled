<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#050506" />
<title>Tiled — premium social dashboard</title>
<link rel="icon" type="image/svg+xml" href="logo.svg" />
<link rel="icon" type="image/png" sizes="96x96" href="favicon-96.png" />
<link rel="icon" type="image/x-icon" sizes="16x16 32x32" href="favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Tiled" />
<meta name="application-name" content="Tiled" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Fraunces:ital,wght@1,300;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="tiled.css?v=10" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="auth.jsx"></script>
<script type="text/babel" src="tile.jsx"></script>
<script type="text/babel" src="chrome.jsx"></script>
<script type="text/babel" src="overlays.jsx"></script>
<script type="text/babel" src="app.jsx"></script>

<script type="text/babel" data-presets="env,react">
const TILED_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "gold",
  "gloss": 5,
  "density": "comfy",
  "fontDisplay": "sans",
  "commentStyle": "modal",
  "showGrain": true,
  "hideSocial": false,
  "hidePro": false,
  "hidePrivate": false
}/*EDITMODE-END*/;

function Root() {
  const [t, setTweak] = useTweaks(TILED_DEFAULTS);
  return (
    <AuthProvider>
      <AuthGate>
        <TiledApp tweaks={t} />
      </AuthGate>
      <TweaksPanel title="Tweaks · Tiled">
        <TweakSection label="Surface" />
        <TweakSlider label="Gloss intensity" value={t.gloss} min={0} max={100} step={5} unit="%"
                     onChange={(v) => setTweak('gloss', v)} />
        <TweakRadio label="Accent" value={t.accent}
                    options={[{value:'gold',label:'Gold'},{value:'platinum',label:'Mono'},{value:'ice',label:'Ice'},{value:'ember',label:'Ember'}]}
                    onChange={(v) => setTweak('accent', v)} />

        <TweakSection label="Layout" />
        <TweakRadio label="Density" value={t.density}
                    options={[{value:'compact',label:'Compact'},{value:'regular',label:'Regular'},{value:'comfy',label:'Comfy'}]}
                    onChange={(v) => setTweak('density', v)} />
        <TweakRadio label="Display font" value={t.fontDisplay}
                    options={[{value:'sans',label:'Sans'},{value:'serif',label:'Serif'}]}
                    onChange={(v) => setTweak('fontDisplay', v)} />

        <TweakSection label="Comments" />
        <TweakSelect label="Style" value={t.commentStyle}
                     options={[{value:'rail',label:'Side rail (default)'},{value:'inline',label:'Inline below tile'},{value:'modal',label:'Modal overlay'}]}
                     onChange={(v) => setTweak('commentStyle', v)} />

        <TweakSection label="Mode toggles" />
        <TweakToggle label="Hide Social" value={t.hideSocial}
                     onChange={(v) => setTweak('hideSocial', v)} />
        <TweakToggle label="Hide Professional" value={t.hidePro}
                     onChange={(v) => setTweak('hidePro', v)} />
        <TweakToggle label="Hide Private" value={t.hidePrivate}
                     onChange={(v) => setTweak('hidePrivate', v)} />
      </TweaksPanel>
    </AuthProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
