services:
  - type: web
    name: tiled
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /
        destination: /Tiled.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # The HTML and service worker must always be revalidated so PWA
      # users pick up new deploys immediately. Without this, Render's CDN
      # serves stale HTML that still references old ?v=N cache-buster
      # versions of the CSS/JSX, and installed PWAs get stuck on old UI.
      - path: /Tiled.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
