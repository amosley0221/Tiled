name: Build Android APK

# Manually trigger this from the Actions tab.
# Pick a branch that contains this file, optionally enter a version, then run.
# The signed APK is uploaded as a workflow artifact (download link valid 90 days).
# ──────────────────────────────────────────────────────────────────────────────
# Consistent APK signing (so users can update without reinstalling):
#   1. Run the workflow once — it auto-generates a keystore and prints its
#      base64 encoding in the "Print keystore" step.
#   2. Copy those three values into Repository → Settings → Secrets → Actions:
#        ANDROID_KEYSTORE_BASE64  ← base64 blob printed by the step
#        KEYSTORE_PASSWORD        ← tiledapp  (or your own password)
#        KEY_PASSWORD             ← tiledapp  (or your own password)
#   Without the secrets, every run creates a fresh keystore; the APK is still
#   installable but a new version will require uninstall → reinstall.
# ──────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name shown in app info (e.g. 1.0.1)'
        required: false
        default: '1.0.0'
      version_code:
        description: 'Integer version code (increment each release)'
        required: false
        default: '1'

jobs:
  build:
    name: Build & sign release APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Toolchain ─────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip \
               -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-inst
          echo "/tmp/gradle-inst/gradle-8.4/bin" >> "$GITHUB_PATH"

      # ── 3. Android SDK ────────────────────────────────────────────────────
      - name: Accept Android SDK licences & install platform
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --licenses > /dev/null 2>&1 || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            > /dev/null 2>&1 || true

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      # ── 4. Icons ──────────────────────────────────────────────────────────
      - name: Copy app icons into Android mipmap directories
        run: |
          for DENSITY in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-${DENSITY}"
            cp icon-192.png \
               "android/app/src/main/res/mipmap-${DENSITY}/ic_launcher.png"
            cp icon-maskable-512.png \
               "android/app/src/main/res/mipmap-${DENSITY}/ic_launcher_round.png"
          done

      # ── 5. Signing ────────────────────────────────────────────────────────
      - name: Restore or generate signing keystore
        id: keystore
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Restoring keystore from repository secret …"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/tiled-release.keystore
            echo "store_pass=$KEYSTORE_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "key_pass=$KEY_PASSWORD"        >> "$GITHUB_OUTPUT"
            echo "fresh=false"                   >> "$GITHUB_OUTPUT"
          else
            echo "No secret found — generating a fresh keystore for this build …"
            keytool -genkey -v \
              -keystore android/tiled-release.keystore \
              -alias tiled \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Tiled App, O=Tiled, C=US" \
              -storepass tiledapp \
              -keypass  tiledapp
            echo "store_pass=tiledapp" >> "$GITHUB_OUTPUT"
            echo "key_pass=tiledapp"   >> "$GITHUB_OUTPUT"
            echo "fresh=true"          >> "$GITHUB_OUTPUT"
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD:        ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD:             ${{ secrets.KEY_PASSWORD }}

      - name: Write signing.properties
        run: |
          cat > android/signing.properties <<EOF
          storeFile=../tiled-release.keystore
          storePassword=${{ steps.keystore.outputs.store_pass }}
          keyAlias=tiled
          keyPassword=${{ steps.keystore.outputs.key_pass }}
          EOF

      # ── 6. Inject version from workflow inputs ────────────────────────────
      - name: Patch version in app/build.gradle
        run: |
          VERSION="${{ github.event.inputs.version || '1.0.0' }}"
          CODE="${{ github.event.inputs.version_code || '1' }}"
          sed -i "s/versionCode .*/versionCode ${CODE}/" \
            android/app/build.gradle
          sed -i "s/versionName .*/versionName \"${VERSION}\"/" \
            android/app/build.gradle

      # ── 7. Build ──────────────────────────────────────────────────────────
      - name: Assemble release APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      # ── 8. Collect & upload ───────────────────────────────────────────────
      - name: Locate APK
        id: apk
        run: |
          PATH_APK=$(find android -name '*.apk' -path '*/release/*' | head -1)
          NAME="Tiled-${{ github.event.inputs.version || '1.0.0' }}.apk"
          cp "$PATH_APK" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tiled-Android-${{ github.event.inputs.version || '1.0.0' }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 90

      # ── 9. Keystore hint (only when freshly generated) ────────────────────
      - name: Print keystore — save these as GitHub Secrets for consistent signing
        if: steps.keystore.outputs.fresh == 'true'
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "  A new signing keystore was generated for this build."
          echo "  To reuse it (so future APKs update in-place on user devices),"
          echo "  add these three secrets in:"
          echo "    GitHub → Settings → Secrets and variables → Actions"
          echo ""
          echo "  ANDROID_KEYSTORE_BASE64:"
          base64 -w 0 android/tiled-release.keystore
          echo ""
          echo "  KEYSTORE_PASSWORD: tiledapp"
          echo "  KEY_PASSWORD:      tiledapp"
          echo "═══════════════════════════════════════════════════════════════"
