name: Android APK

# Builds a self-contained APK that bundles the Tiled site inside its
# assets/ folder and loads it from file:///android_asset/site/Tiled.html.
# The APK is published two ways:
#   - As a workflow artifact on every push to main / this branch (short-lived).
#   - As an asset on the "android-latest" rolling release (stable download link).
on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "*.html"
      - "*.jsx"
      - "*.css"
      - "*.js"
      - "*.webmanifest"
      - "*.svg"
      - "*.png"
      - "*.ico"
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Copy site files into APK assets
        run: |
          set -eux
          dest=android/app/src/main/assets/site
          rm -rf "$dest"
          mkdir -p "$dest"
          # Copy every top-level web asset (HTML/JSX/CSS/manifest/icons)
          # excluding the android/, supabase/, .git/ trees and infra files.
          for f in *.html *.jsx *.css *.js *.webmanifest *.svg *.png *.ico; do
            [ -e "$f" ] && cp -v "$f" "$dest/" || true
          done

      - name: Build release APK
        working-directory: android
        run: |
          set -eux
          gradle --no-daemon :app:assembleRelease

      - name: Locate APK
        id: apk
        run: |
          set -eux
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          renamed="Tiled-${GITHUB_SHA::7}.apk"
          cp "$apk" "$renamed"
          echo "path=$renamed" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tiled-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Tiled Android (latest)
          body: |
            Latest Tiled Android build.

            Install: download `Tiled-*.apk`, open it on your phone, and
            allow install from this source when Android prompts you.

            Built from commit ${{ github.sha }}.
          files: ${{ steps.apk.outputs.path }}
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
